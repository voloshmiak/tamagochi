# Локальне середовище однією командою: docker compose up --build
# Застосунок буде доступний на https://localhost:8443 (порти змінюються через
# CADDY_HTTPS_PORT і CADDY_HTTP_PORT; тоді змініть і PUBLIC_URL).
# Усі змінні мають значення за замовчуванням, тож .env для першого запуску не потрібен.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tamagochi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tamagochi}
      POSTGRES_DB: ${POSTGRES_DB:-tamagochi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-dev}
      HTTP_ADDR: ":8080"
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret}
      ACCESS_TTL: ${ACCESS_TTL:-15m}
      REFRESH_TTL: ${REFRESH_TTL:-720h}
      BRAIN_SEED: ${BRAIN_SEED:-42}
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost:8443}
      # Застосунок віддається лише по HTTPS, тож cookie завжди з атрибутом Secure.
      COOKIE_SECURE: "true"
      DATABASE_URL: postgres://${POSTGRES_USER:-tamagochi}:${POSTGRES_PASSWORD:-tamagochi}@postgres:5432/${POSTGRES_DB:-tamagochi}?sslmode=disable
      MIGRATE_ON_START: "true"
      REDIS_URL: redis://redis:6379/0
      SMTP_ADDR: ${SMTP_ADDR:-mailpit:1025}
      SMTP_FROM: ${SMTP_FROM:-Tamagochi <no-reply@tamagochi.local>}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy.Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TLS_ISSUER: ${TLS_ISSUER:-internal}
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost:8443}
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Адмін-API Caddy слухає лише всередині контейнера.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Локальна «поштова скринька»: листи з підтвердженням email видно на http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  ready:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        echo ""
        echo "  Застосунок готовий: $${PUBLIC_URL}"
        echo "  Листи (Mailpit):    http://localhost:$${MAILPIT_UI_PORT}"
        echo ""
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost:8443}
      MAILPIT_UI_PORT: ${MAILPIT_UI_PORT:-8025}
    depends_on:
      caddy:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
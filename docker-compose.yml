# Локальне середовище однією командою: docker compose up --build
# Застосунок буде доступний на http://localhost:8080 (порт змінюється через CADDY_HTTP_PORT).
# Усі змінні мають значення за замовчуванням, тож .env для першого запуску не потрібен.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tamagochi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tamagochi}
      POSTGRES_DB: ${POSTGRES_DB:-tamagochi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-dev}
      HTTP_ADDR: ":8080"
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret}
      ACCESS_TTL: ${ACCESS_TTL:-15m}
      REFRESH_TTL: ${REFRESH_TTL:-720h}
      BRAIN_SEED: ${BRAIN_SEED:-42}
      DATABASE_URL: postgres://${POSTGRES_USER:-tamagochi}:${POSTGRES_PASSWORD:-tamagochi}@postgres:5432/${POSTGRES_DB:-tamagochi}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy.Dockerfile
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ready:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        echo ""
        echo "  Застосунок готовий: http://localhost:$${CADDY_HTTP_PORT:-8080}"
        echo ""
    environment:
      CADDY_HTTP_PORT: ${CADDY_HTTP_PORT:-8080}
    depends_on:
      caddy:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config: